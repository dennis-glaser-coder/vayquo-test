<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#151617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VAYQUO">
<meta name="description" content="VAYQUO – hol mehr aus Punkten, Meilen und Kartenvorteilen heraus.">
<title>VAYQUO</title>
<style>html,body{margin:0;min-height:100%;background:#07191b;color:#f8f4ed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}.loading b{display:block;font-size:17px;letter-spacing:.22em}.loading small{display:block;margin-top:11px;color:#9ba9a8;font-size:12px;line-height:1.5}</style>
</head>
<body>
<div class="loading" id="loading"><div><b>VAYQUO</b><small>App wird geladen …</small></div></div>
<script>
(async()=>{
 try{
  if(typeof DecompressionStream==='undefined') throw new Error('Browser unterstützt Dekomprimierung nicht');
  const files=["assets/data-01.txt", "assets/data-02.txt", "assets/data-03.txt", "assets/data-04.txt", "assets/data-05.txt", "assets/data-06.txt", "assets/data-07.txt"];
  const parts=await Promise.all(files.map(async file=>{const response=await fetch(file,{cache:'no-store'});if(!response.ok)throw new Error('Fehlende App-Datei: '+file);return (await response.text()).trim();}));
  const binary=atob(parts.join(''));
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  const navFix='<style id="v23-nav-fix">@media(max-width:679px){.bottom{bottom:max(4px,calc(var(--safe-bottom) - 8px))!important;height:60px!important;width:min(calc(100% - 18px),442px)!important;padding:5px!important;border-radius:19px!important;box-shadow:0 10px 26px rgba(18,18,18,.09)!important}.nav{font-size:9px!important;gap:3px!important;border-radius:14px!important}.nav svg{width:20px!important;height:20px!important}main{padding-bottom:calc(122px + var(--safe-bottom))!important}.toast{bottom:calc(76px + var(--safe-bottom))!important}}</style>';
  const step2Assets='<link rel="stylesheet" href="v24-step2.css?v=2402"><script src="v24-step2.js?v=2402"><\/script>';
  let patchedHtml=html.includes('</head>')?html.replace('</head>',navFix+'</head>'):html+navFix;
  patchedHtml=patchedHtml.includes('</body>')?patchedHtml.replace('</body>',step2Assets+'</body>'):patchedHtml+step2Assets;
  document.open();document.write(patchedHtml);document.close();
 }catch(error){console.error(error);document.getElementById('loading').innerHTML='<div><b>VAYQUO</b><small>Die App konnte nicht geladen werden.<br>Bitte die Seite neu laden oder einen aktuellen Browser verwenden.</small></div>';}
})();
</script>
</body>
</html>
