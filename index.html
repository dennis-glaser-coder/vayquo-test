<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#151617">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VAYQUO">
<meta name="description" content="VAYQUO – hol mehr aus Punkten, Meilen und Kartenvorteilen heraus.">
<title>VAYQUO</title>
<style>
html,body{margin:0;min-height:100%;background:#07191b;color:#f8f4ed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box;opacity:1;transform:scale(1);transition:opacity .24s ease,transform .24s ease}
.loading.leaving{opacity:0;transform:scale(.985)}
.loading b{display:block;font-size:18px;letter-spacing:.24em}
.loading .claim{display:block;margin-top:18px;color:#f8f4ed;font-size:19px;line-height:1.35;font-weight:650;letter-spacing:-.02em}
.loading small{display:block;margin-top:12px;color:#9ba9a8;font-size:11px;line-height:1.5}
</style>
</head>
<body>
<div class="loading" id="loading"><div><b>VAYQUO</b><span class="claim">Nicht einfach Punkte haben.<br>Das Maximum daraus machen.</span><small>Punkte · Meilen · Vorteile</small></div></div>
<script>
(async()=>{
 const introStarted=Date.now();
 try{
  if(typeof DecompressionStream==='undefined') throw new Error('Browser unterstützt Dekomprimierung nicht');
  const files=["assets/data-01.txt", "assets/data-02.txt", "assets/data-03.txt", "assets/data-04.txt", "assets/data-05.txt", "assets/data-06.txt", "assets/data-07.txt"];
  const parts=await Promise.all(files.map(async file=>{const response=await fetch(file,{cache:'no-store'});if(!response.ok)throw new Error('Fehlende App-Datei: '+file);return (await response.text()).trim();}));
  const binary=atob(parts.join(''));
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  const navFix='<style id="v23-nav-fix">@media(max-width:679px){.bottom{bottom:max(4px,calc(var(--safe-bottom) - 8px))!important;height:60px!important;width:min(calc(100% - 18px),442px)!important;padding:5px!important;border-radius:19px!important;box-shadow:0 10px 26px rgba(18,18,18,.09)!important}.nav{font-size:9px!important;gap:3px!important;border-radius:14px!important}.nav svg{width:20px!important;height:20px!important}main{padding-bottom:calc(122px + var(--safe-bottom))!important}.toast{bottom:calc(76px + var(--safe-bottom))!important}}</style>';
  const step2Assets='<link rel="stylesheet" href="v24-step2.css?v=2403"><script src="v24-step2.js?v=2403"><\/script>';
  const step2InfoTrimAssets='<script src="v24-step2-info-trim.js?v=2404"><\/script>';
  const step3Assets='<link rel="stylesheet" href="v24-step3.css?v=2402"><script src="v24-step3.js?v=2402"><\/script>';
  const step35Assets='<link rel="stylesheet" href="v24-step35.css?v=2444"><script src="v24-step35.js?v=2444"><\/script>';
  const step35MmAssets='<script src="v24-step35-mm.js?v=2440"><\/script>';
  const pointsBalanceAssets='<link rel="stylesheet" href="v24-points-balance.css?v=2401"><script src="v24-points-balance.js?v=2402"><\/script>';
  const startFilterAssets='<script src="v24-start-filter.js?v=2401"><\/script>';
  let patchedHtml=html.includes('</head>')?html.replace('</head>',navFix+'</head>'):html+navFix;
  patchedHtml=patchedHtml.includes('</body>')?patchedHtml.replace('</body>',step2Assets+step2InfoTrimAssets+step3Assets+step35Assets+step35MmAssets+pointsBalanceAssets+startFilterAssets+'</body>'):patchedHtml+step2Assets+step2InfoTrimAssets+step3Assets+step35Assets+step35MmAssets+pointsBalanceAssets+startFilterAssets;
  const remaining=Math.max(0,1450-(Date.now()-introStarted));
  if(remaining) await new Promise(resolve=>setTimeout(resolve,remaining));
  document.getElementById('loading')?.classList.add('leaving');
  await new Promise(resolve=>setTimeout(resolve,240));
  document.open();document.write(patchedHtml);document.close();
 }catch(error){console.error(error);document.getElementById('loading').innerHTML='<div><b>VAYQUO</b><small>Die App konnte nicht geladen werden.<br>Bitte die Seite neu laden oder einen aktuellen Browser verwenden.</small></div>';}
})();
</script>
</body>
</html>
