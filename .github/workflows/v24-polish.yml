name: build-vayquo-v24-polish
on:
  push:
    branches:
      - agent/vayquo-v2-4-polish
    paths:
      - .v24-polish-trigger
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify V2.4 source
        shell: bash
        run: |
          cat assets/data-*.txt | tr -d '\n\r ' | base64 --decode | gzip --decompress --stdout > source-before.html
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          s=Path('source-before.html').read_text()
          assert hashlib.sha256(s.encode()).hexdigest()=='4dd74a44bd68977462657f6f19491083fd696be2bc543b751a3d09abe39bea1f'

          css_old='.v24-manual[open] summary{margin-bottom:7px}.v24-flight-tool .desc{margin-bottom:12px}'
          css_new='.v24-manual[open] summary{margin-bottom:7px}.v24-flight-tool .desc{margin-bottom:12px}.v24-screenshot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;padding:11px 12px;border:1px dashed rgba(22,23,23,.16);border-radius:14px;background:#faf7f1}.v24-screenshot span{font-size:8.8px;line-height:1.4;color:#77736b}.v24-screenshot button{flex:none;min-height:34px;padding:0 10px;border:0;border-radius:10px;background:#242525;color:#fff;font-size:8.8px;font-weight:760}.v24-scan-status{display:none;margin:-2px 0 9px;font-size:8.5px;line-height:1.4;color:#7e7a73}.v24-scan-status.visible{display:block}'
          assert s.count(css_old)==1
          s=s.replace(css_old,css_new,1)

          bind_old="""function v24BindAwardStep(){
    const sel=document.getElementById('fProgram'),have=document.getElementById('fHave');
    if(sel&&have){have.value=v23FlightHaveDefault(sel.value);sel.onchange=()=>{have.value=v23FlightHaveDefault(sel.value)}}
    document.getElementById('calcF').onclick=v23CalcFlight;
    v24BindHelp(document.getElementById('v24AwardStep'));
  }"""
          bind_new="""function v24BindAwardStep(){
    const sel=document.getElementById('fProgram'),have=document.getElementById('fHave');
    if(sel&&have){have.value=v23FlightHaveDefault(sel.value);sel.onchange=()=>{have.value=v23FlightHaveDefault(sel.value)}}
    document.getElementById('calcF').onclick=v23CalcFlight;
    const shot=document.getElementById('v24Screenshot'),shotBtn=document.getElementById('v24ScreenshotBtn'),status=document.getElementById('v24ScanStatus');
    if(shot&&shotBtn){shotBtn.onclick=()=>shot.click();shot.onchange=()=>{const f=shot.files&&shot.files[0];if(!f)return;status.textContent=`${f.name} ausgewählt. Automatisches Auslesen folgt mit OCR/API; aktuell ergänzt du Punktepreis und Gebühren darunter.`;status.classList.add('visible')}}
    v24BindHelp(document.getElementById('v24AwardStep'));
  }"""
          assert s.count(bind_old)==1
          s=s.replace(bind_old,bind_new,1)

          marker='<div class="v24-step-label">2 · Punkteangebot</div><div class="field"><label>Programm</label>'
          insert='<div class="v24-step-label">2 · Punkteangebot</div><div class="v24-screenshot"><span><strong>Screenshot vorhanden?</strong><br>Schon jetzt auswählen; automatisches Auslesen kommt mit OCR/API.</span><button type="button" id="v24ScreenshotBtn">Screenshot wählen</button><input type="file" id="v24Screenshot" accept="image/*" hidden></div><div id="v24ScanStatus" class="v24-scan-status"></div><div class="field"><label>Programm</label>'
          assert s.count(marker)==1
          s=s.replace(marker,insert,1)

          old_notice='Screenshot-Erkennung ist als nächster Datenweg vorgesehen. Bis dahin musst du nur den Prämienpreis und die Gebühren aus deinem Punkteprogramm ergänzen.'
          new_notice='Der Screenshot kann bereits ausgewählt werden. Das automatische Auslesen ist noch nicht aktiv; bis zur OCR/API ergänzt du nur Prämienpreis und Gebühren.'
          assert s.count(old_notice)==1
          s=s.replace(old_notice,new_notice,1)

          old_result='function v23Result(title,copy,stats,note){return `<div class="v23-result"><div class="label">VAYQUO EINORDNUNG</div><h4>${esc(title)}</h4><p>${esc(copy)}</p><div class="v23-result-grid">${stats.map(([k,v])=>`<div class="v23-result-stat"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join(\'\')}</div><div class="v23-result-note">${esc(note)}</div></div>`}'
          new_result='function v23Result(title,copy,stats,note){return `<div class="v23-result"><div class="label">VAYQUO DEMO-EINORDNUNG</div><h4>${esc(title)}</h4><p>${esc(copy)}</p><div class="v23-result-grid">${stats.map(([k,v])=>`<div class="v23-result-stat"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join(\'\')}</div><div class="v23-result-note">Demo-Barpreis – nicht als Live-Angebot verwenden. ${esc(note)}</div></div>`}'
          assert s.count(old_result)==1
          s=s.replace(old_result,new_result,1)

          assert 'MutationObserver' not in s
          assert s.count('VAYQUO DEMO-EINORDNUNG')==1
          assert s.count('v24ScreenshotBtn')>=2
          Path('source-built.html').write_text(s)
          print('source_sha256='+hashlib.sha256(s.encode()).hexdigest())
          raw=s.encode(); enc=base64.b64encode(gzip.compress(raw,mtime=0)).decode(); parts=[enc[i:i+14000] for i in range(0,len(enc),14000)]
          assert len(parts)==7
          for i,p in enumerate(parts,1):Path(f'assets/data-{i:02d}.txt').write_text(p)
          joined=''.join(Path(f'assets/data-{i:02d}.txt').read_text() for i in range(1,8));assert gzip.decompress(base64.b64decode(joined))==raw
          print('payload_parts=',[len(x) for x in parts])
          PY
      - name: Commit payload to isolated branch
        shell: bash
        run: |
          git config user.name "dennis-glaser-coder"
          git config user.email "dennis-glaser@gmx.de"
          git add assets/data-*.txt
          git commit -m "Polish VAYQUO V2.4 flight demo [skip ci]"
          git push origin HEAD:agent/vayquo-v2-4-polish
      - uses: actions/upload-artifact@v4
        with:
          name: vayquo-v24-polished-source
          path: source-built.html
          retention-days: 1
