name: Build VAYQUO V2.4 rebuild

on:
  push:
    branches:
      - agent/vayquo-v2-4-rebuild
    paths:
      - '.github/workflows/unpack-vayquo.yml'
      - 'tools/patch-v24.py.gz.b64'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated rebuild branch
        uses: actions/checkout@v4
        with:
          ref: agent/vayquo-v2-4-rebuild

      - name: Reconstruct stable V2.3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat assets/data-*.txt | tr -d '\r\n ' | base64 --decode | gzip --decompress --stdout > build/app-v23.html
          grep -q "V2.3" build/app-v23.html

      - name: Apply direct-source V2.4 rebuild
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/patch-v24.py.gz.b64 | gzip --decompress --stdout > build/patch-v24.py
          python3 build/patch-v24.py build/app-v23.html build/app-v24.html
          grep -q "V2.4" build/app-v24.html
          grep -q "v24OpenSixt" build/app-v24.html
          grep -q "v23OpenLounges" build/app-v24.html
          grep -q "v23OpenRestaurant" build/app-v24.html

      - name: Check every inline script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('build/app-v24.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          if not scripts:
              raise SystemExit('No scripts found')
          out=Path('build/scripts'); out.mkdir(exist_ok=True)
          for i,s in enumerate(scripts):
              (out/f'script-{i}.js').write_text(s,encoding='utf-8')
          print(f'Extracted {len(scripts)} scripts')
          PY
          for f in build/scripts/*.js; do node --check "$f"; done

      - name: Pack into the existing seven-file loader format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip,base64
          src=Path('build/app-v24.html').read_bytes()
          data=base64.b64encode(gzip.compress(src,compresslevel=9,mtime=0)).decode('ascii')
          if len(data)>98000:
              raise SystemExit(f'Payload too large for seven chunks: {len(data)}')
          data=data.ljust(7*14000,' ')
          for i in range(7):
              chunk=data[i*14000:(i+1)*14000].rstrip()
              Path(f'assets/data-{i+1:02d}.txt').write_text(chunk,encoding='utf-8')
          joined=''.join(Path(f'assets/data-{i:02d}.txt').read_text().strip() for i in range(1,8))
          decoded=gzip.decompress(base64.b64decode(joined))
          if decoded!=src:
              raise SystemExit('Packed payload roundtrip failed')
          Path('build/build-check.txt').write_text(
              f'VAYQUO V2.4 direct-source rebuild OK\nsource_bytes={len(src)}\nbase64_bytes={len(joined)}\nchunks=7\ninline_script_syntax=OK\nroundtrip=OK\n',encoding='utf-8')
          print(Path('build/build-check.txt').read_text())
          PY

      - name: Commit packaged V2.4 only to rebuild branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data-*.txt
          if git diff --cached --quiet; then
            echo "No payload changes to commit"
          else
            git commit -m "Package direct-source VAYQUO V2.4 rebuild [skip ci]"
            git push origin HEAD:agent/vayquo-v2-4-rebuild
          fi

      - name: Upload rebuilt source and checks
        uses: actions/upload-artifact@v4
        with:
          name: vayquo-v24-rebuild-check
          path: |
            build/app-v24.html
            build/build-check.txt
          if-no-files-found: error
          retention-days: 7
