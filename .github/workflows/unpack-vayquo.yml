name: build-vayquo-v24-direct
on:
  push:
    branches:
      - agent/vayquo-v2-4-direct
    paths:
      - .v24-build-trigger
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build exact tested V2.4 payload
        shell: bash
        run: |
          cat assets/data-*.txt | tr -d '\n\r ' | base64 --decode | gzip --decompress --stdout > source-v23.html
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          src=Path('source-v23.html').read_text()
          parts=sorted(Path('tools/v24_parts').glob('*.part'))
          assert len(parts)==8, parts
          block=''.join(p.read_text() for p in parts)
          block_digest=hashlib.sha256(block.encode()).hexdigest()
          print('block_sha256='+block_digest)
          assert block_digest == 'c059f83dd31cfe2e7f9cf537843ee2733d14d324637f3ca1f43fef59b281bfbe'

          start=src.rfind('<style id="v23-action-ux">')
          end=src.rfind('</body>')
          assert start > 0 and end > start
          src=src[:start]+block+'\n'+src[end:]

          old="function save(){state.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state))}"
          new="function save(){state.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}"
          assert old in src
          src=src.replace(old,new,1)

          raw=src.encode()
          digest=hashlib.sha256(raw).hexdigest()
          print('source_sha256='+digest)
          assert digest == '2b4bbe24643acc2868bf8e8cb8c0a861e2056982e2268aa03d317295bb5e767f'

          encoded=base64.b64encode(gzip.compress(raw,mtime=0)).decode()
          payload=[encoded[i:i+14000] for i in range(0,len(encoded),14000)]
          assert len(payload)==7
          out=Path('assets')
          for i,part in enumerate(payload,1):
              (out/f'data-{i:02d}.txt').write_text(part)
          joined=''.join((out/f'data-{i:02d}.txt').read_text() for i in range(1,8))
          assert gzip.decompress(base64.b64decode(joined)) == raw
          print('payload_parts=', [len(x) for x in payload])
          PY
      - name: Commit payload to isolated branch
        shell: bash
        run: |
          git config user.name "dennis-glaser-coder"
          git config user.email "dennis-glaser@gmx.de"
          git add assets/data-*.txt
          git commit -m "Build VAYQUO V2.4 direct payload [skip ci]"
          git push origin HEAD:agent/vayquo-v2-4-direct
