name: VAYQUO engine tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v25-engine-v2.js'
      - 'v25-engine-selftest-v2.js'
      - 'v25-classic-engine-bridge.js'
      - 'config/vayquo-optimizer-rules.de.json'
      - 'tests/v25-engine.test.cjs'
      - '.github/workflows/vayquo-engine-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'v25-engine-v2.js'
      - 'v25-engine-selftest-v2.js'
      - 'v25-classic-engine-bridge.js'
      - 'config/vayquo-optimizer-rules.de.json'
      - 'tests/v25-engine.test.cjs'
      - '.github/workflows/vayquo-engine-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run VAYQUO engine tests
        run: node tests/v25-engine.test.cjs