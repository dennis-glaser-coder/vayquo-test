name: VAYQUO product tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'kunde.html'
      - 'partner.html'
      - 'partner-portal.html'
      - 'rechtliches.html'
      - 'ueber-vayquo.html'
      - 'photovoltaik/**'
      - 'heizung/**'
      - 'kueche/**'
      - 'bad/**'
      - 'assets/vayquo-machine.js'
      - 'assets/vayquo-machine.css'
      - 'assets/vayquo-smart-result.js'
      - 'assets/vayquo-smart-result.css'
      - 'assets/vayquo-customer.js'
      - 'assets/vayquo-customer.css'
      - 'assets/vayquo-portal.js'
      - 'assets/vayquo-portal.css'
      - 'assets/vayquo-payments.js'
      - 'assets/vayquo-partner.js'
      - 'assets/vayquo-partner.css'
      - 'v36-anonymous-analytics.js'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'README.md'
      - 'tests/setup-contract.test.cjs'
      - 'tests/stripe-payment-contract.test.cjs'
      - '.github/workflows/vayquo-engine-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'kunde.html'
      - 'partner.html'
      - 'partner-portal.html'
      - 'rechtliches.html'
      - 'ueber-vayquo.html'
      - 'photovoltaik/**'
      - 'heizung/**'
      - 'kueche/**'
      - 'bad/**'
      - 'assets/vayquo-machine.js'
      - 'assets/vayquo-machine.css'
      - 'assets/vayquo-smart-result.js'
      - 'assets/vayquo-smart-result.css'
      - 'assets/vayquo-customer.js'
      - 'assets/vayquo-customer.css'
      - 'assets/vayquo-portal.js'
      - 'assets/vayquo-portal.css'
      - 'assets/vayquo-payments.js'
      - 'assets/vayquo-partner.js'
      - 'assets/vayquo-partner.css'
      - 'v36-anonymous-analytics.js'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'README.md'
      - 'tests/setup-contract.test.cjs'
      - 'tests/stripe-payment-contract.test.cjs'
      - '.github/workflows/vayquo-engine-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current product JavaScript syntax
        run: |
          node --check assets/vayquo-machine.js
          node --check assets/vayquo-smart-result.js
          node --check assets/vayquo-customer.js
          node --check assets/vayquo-portal.js
          node --check assets/vayquo-payments.js
          node --check assets/vayquo-partner.js
          node --check v36-anonymous-analytics.js
      - name: Verify current house-project product contract
        run: node tests/setup-contract.test.cjs
      - name: Verify Stripe partner payment gate
        run: node tests/stripe-payment-contract.test.cjs
