name: VAYQUO product tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'kunde.html'
      - 'partner.html'
      - 'partner-portal.html'
      - 'rechtliches.html'
      - 'bad/index.html'
      - 'assets/vayquo-machine.js'
      - 'assets/vayquo-machine.css'
      - 'assets/vayquo-smart-result.js'
      - 'assets/vayquo-smart-result.css'
      - 'assets/vayquo-customer.js'
      - 'assets/vayquo-customer.css'
      - 'assets/vayquo-portal.js'
      - 'assets/vayquo-portal.css'
      - 'assets/vayquo-marketplace-bridge.js'
      - 'assets/vayquo-partner.js'
      - 'assets/vayquo-partner.css'
      - 'v36-anonymous-analytics.js'
      - 'config/vayquo-revenue-priority-2026-09.json'
      - 'tests/setup-contract.test.cjs'
      - '.github/workflows/vayquo-engine-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'kunde.html'
      - 'partner.html'
      - 'partner-portal.html'
      - 'rechtliches.html'
      - 'bad/index.html'
      - 'assets/vayquo-machine.js'
      - 'assets/vayquo-machine.css'
      - 'assets/vayquo-smart-result.js'
      - 'assets/vayquo-smart-result.css'
      - 'assets/vayquo-customer.js'
      - 'assets/vayquo-customer.css'
      - 'assets/vayquo-portal.js'
      - 'assets/vayquo-portal.css'
      - 'assets/vayquo-marketplace-bridge.js'
      - 'assets/vayquo-partner.js'
      - 'assets/vayquo-partner.css'
      - 'v36-anonymous-analytics.js'
      - 'config/vayquo-revenue-priority-2026-09.json'
      - 'tests/setup-contract.test.cjs'
      - '.github/workflows/vayquo-engine-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check product JavaScript syntax
        run: node --check assets/vayquo-machine.js && node --check assets/vayquo-smart-result.js && node --check assets/vayquo-customer.js && node --check assets/vayquo-portal.js && node --check assets/vayquo-marketplace-bridge.js && node --check assets/vayquo-partner.js && node --check v36-anonymous-analytics.js
      - name: Verify instant-check and structured-comparison contract
        run: node tests/setup-contract.test.cjs
