name: VAYQUO product tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/setup-v2.js'
      - 'assets/setup-v2.css'
      - 'assets/premium-studio.js'
      - 'assets/homegym-live.js'
      - 'assets/homegym-live.css'
      - 'assets/flagship-homegym.js'
      - 'assets/flagship-homegym.css'
      - 'v36-anonymous-analytics.js'
      - 'tests/setup-contract.test.cjs'
      - '.github/workflows/vayquo-engine-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/setup-v2.js'
      - 'assets/setup-v2.css'
      - 'assets/premium-studio.js'
      - 'assets/homegym-live.js'
      - 'assets/homegym-live.css'
      - 'assets/flagship-homegym.js'
      - 'assets/flagship-homegym.css'
      - 'v36-anonymous-analytics.js'
      - 'tests/setup-contract.test.cjs'
      - '.github/workflows/vayquo-engine-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check product JavaScript syntax
        run: node --check assets/setup-v2.js && node --check assets/premium-studio.js && node --check assets/homegym-live.js && node --check assets/flagship-homegym.js && node --check v36-anonymous-analytics.js
      - name: Verify setup product contract
        run: node tests/setup-contract.test.cjs
