      - 'v29-ui-consistency.js'
      - 'v30-points-page-cleanup.js'
      - 'v31-card-advisor-unsure-ux.js'
      - 'config/vayquo-card-advisor.de.json'
      - 'pulse.html'
      - 'tests/pulse-card-state.test.cjs'
      - 'tests/card-advisor.test.cjs'
      - 'tests/card-advisor-v29.test.cjs'
      - 'tests/card-ecosystem-context.test.cjs'
      - 'tests/card-tier-context.test.cjs'
      - 'tests/ui-consistency.test.cjs'
      - 'tests/points-page-cleanup.test.cjs'
      - 'v25-engine-v2.js'
      - 'v25-engine-selftest-v2.js'
      - 'v25-classic-engine-bridge.js'
      - 'config/vayquo-optimizer-rules.de.json'
      - 'tests/v25-engine.test.cjs'
      - 'config/vayquo-fact-governance.de.json'
      - 'config/vayquo-program-facts.de.json'
      - 'tests/content-fact-consistency.test.cjs'
      - 'ratgeber/*.html'
      - 'v24-offer-context.js'
      - 'v24-benefit-optimizer.js'
      - 'v36-anonymous-analytics.js'
      - 'config/vayquo-analytics.de.json'
      - 'rechtliches.html'
      - 'tests/anonymous-analytics.test.cjs'
      - '.github/workflows/vayquo-engine-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'v24-auth.js'
      - 'v40-card-result-open.js'
      - 'v24-onboarding.js'
      - 'v33-navigation-state.js'
      - 'v33-card-flow-stability.js'
      - 'v33-contextual-setup.js'
      - 'v34-card-catalog-runtime.js'
      - 'tests/deferred-auth.test.cjs'
      - 'tests/full-flow-audit.cjs'
      - 'tests/flow-stability.test.cjs'
      - 'tests/card-catalog-runtime.test.cjs'
      - 'assets/data-*.txt'
      - 'v26-award-coming-soon.js'
      - 'config/vayquo-award-release.de.json'
      - 'tests/award-release-gate.test.cjs'
      - 'v24-card-check.js'
      - 'v24-points-balance.js'
      - 'v28-card-advisor-engine.js'
      - 'v28-card-advisor.js'
      - 'v28-card-advisor-abroad-ux.js'
      - 'v28-card-advisor-provider-cta.js'
      - 'v42-card-ecosystem-policy.js'
      - 'v42-card-ecosystem-context.js'
      - 'v43-card-tier-policy.js'
      - 'v43-card-tier-context.js'
      - 'v29-ui-consistency.js'
      - 'v30-points-page-cleanup.js'
      - 'v31-card-advisor-unsure-ux.js'
      - 'config/vayquo-card-advisor.de.json'
      - 'pulse.html'
      - 'tests/pulse-card-state.test.cjs'
      - 'tests/card-advisor.test.cjs'
      - 'tests/card-advisor-v29.test.cjs'
      - 'tests/card-ecosystem-context.test.cjs'
      - 'tests/card-tier-context.test.cjs'
      - 'tests/ui-consistency.test.cjs'
      - 'tests/points-page-cleanup.test.cjs'
      - 'v25-engine-v2.js'
      - 'v25-engine-selftest-v2.js'
      - 'v25-classic-engine-bridge.js'
      - 'config/vayquo-optimizer-rules.de.json'
      - 'tests/v25-engine.test.cjs'
      - 'config/vayquo-fact-governance.de.json'
      - 'config/vayquo-program-facts.de.json'
      - 'tests/content-fact-consistency.test.cjs'
      - 'ratgeber/*.html'
      - 'v24-offer-context.js'
      - 'v24-benefit-optimizer.js'
      - 'v36-anonymous-analytics.js'
      - 'config/vayquo-analytics.de.json'
      - 'rechtliches.html'
      - 'tests/anonymous-analytics.test.cjs'
      - '.github/workflows/vayquo-engine-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit compressed core navigation and persistence
        run: node tests/full-flow-audit.cjs
      - name: Check flow stability syntax
        run: node --check v24-onboarding.js && node --check v33-navigation-state.js && node --check v33-card-flow-stability.js && node --check v33-contextual-setup.js
      - name: Verify guest, Back and refresh continuity
        run: node tests/flow-stability.test.cjs
      - name: Check optimizer bridge syntax
        run: node --check v25-classic-engine-bridge.js
      - name: Check auth syntax
        run: node --check v24-auth.js && node --check v40-card-result-open.js
      - name: Verify deferred guest-to-decision auth
        run: node tests/deferred-auth.test.cjs
      - name: Check award gate syntax
        run: node --check v26-award-coming-soon.js
      - name: Verify public award release gate
        run: node tests/award-release-gate.test.cjs
      - name: Check card advisor and UI syntax
        run: node --check v28-card-advisor-engine.js && node --check v28-card-advisor.js && node --check v28-card-advisor-abroad-ux.js && node --check v28-card-advisor-provider-cta.js && node --check v42-card-ecosystem-policy.js && node --check v42-card-ecosystem-context.js && node --check v43-card-tier-policy.js && node --check v43-card-tier-context.js && node --check v31-card-advisor-unsure-ux.js && node --check v29-ui-consistency.js && node --check v30-points-page-cleanup.js && node --check v24-points-balance.js && node --check v24-card-check.js && node --check v34-card-catalog-runtime.js
      - name: Check anonymous analytics syntax
        run: node --check v36-anonymous-analytics.js
      - name: Verify anonymous analytics privacy gate
        run: node tests/anonymous-analytics.test.cjs
      - name: Verify instant card catalog runtime
        run: node tests/card-catalog-runtime.test.cjs
      - name: Verify PULSE owned-card bridge
        run: node tests/pulse-card-state.test.cjs
      - name: Verify cross-surface content fact consistency
        run: node tests/content-fact-consistency.test.cjs
      - name: Verify existing card advisor decision matrix
        run: node tests/card-advisor.test.cjs
      - name: Verify refined card advisor matrix
        run: node tests/card-advisor-v29.test.cjs
      - name: Verify ecosystem challenge context
        run: node tests/card-ecosystem-context.test.cjs
      - name: Verify higher-tier explanation context
        run: node tests/card-tier-context.test.cjs
      - name: Verify UI order and theme consistency
        run: node tests/ui-consistency.test.cjs
      - name: Verify points page hierarchy and deduplication
        run: node tests/points-page-cleanup.test.cjs
      - name: Run VAYQUO engine tests
        run: node tests/v25-engine.test.cjs
