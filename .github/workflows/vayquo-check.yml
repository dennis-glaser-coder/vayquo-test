name: VAYQUO checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/setup-v2.js
          node --check assets/premium-studio.js
          node --check assets/homegym-live.js
          node --check v36-anonymous-analytics.js
      - name: Check required files
        run: |
          test -s index.html
          test -s assets/setup-v2.css
          test -s assets/homegym-live.css
          test -s CNAME
