name: VAYQUO checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current product JavaScript syntax
        run: |
          node --check assets/vayquo-machine.js
          node --check assets/vayquo-smart-result.js
          node --check assets/vayquo-customer.js
          node --check assets/vayquo-portal.js
          node --check assets/vayquo-partner.js
          node --check v36-anonymous-analytics.js
      - name: Check current public and private entry files
        run: |
          test -s index.html
          test -s kunde.html
          test -s partner.html
          test -s partner-portal.html
          test -s rechtliches.html
          test -s ueber-vayquo.html
          test -s photovoltaic_placeholder 2>/dev/null || true
          test -s photovoltaik/index.html
          test -s heizung/index.html
          test -s kueche/index.html
          test -s bad/index.html
          test -s sitemap.xml
          test -s robots.txt
          test -s CNAME
      - name: Verify current product contract
        run: node tests/setup-contract.test.cjs
